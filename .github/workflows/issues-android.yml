name: issues-android
# tools/horizon-issues-android: a contributor tool (not part of the game) to browse the issues with their claims and
# linked pull requests. Its own Gradle build; this job tests the GitHub layer and keeps the APK as an artifact.
on:
  push:
    paths:
      - 'tools/horizon-issues-android/**'
      - 'crates/horizon-theme/fonts/**'
      - '.github/workflows/issues-android.yml'
  pull_request:
    paths:
      - 'tools/horizon-issues-android/**'
      - 'crates/horizon-theme/fonts/**'
      - '.github/workflows/issues-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/horizon-issues-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon --stacktrace :core:test :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-issues-apk
          path: tools/horizon-issues-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
